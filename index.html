<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <div class="card">
      <header>
        <h1>My To-Do List</h1>
      </header>

      <main>
        <form id="task-form">
          <label for="task-input">New task</label>
          <input type="text" id="task-input">
          <button type="submit">Add</button>
        </form>

        <p id="error-message"></p>

        <ul id="task-list"></ul>
      </main>
    </div>

    <script src="script.js"></script>
  </body>

</html>
